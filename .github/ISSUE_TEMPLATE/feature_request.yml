name: Feature request
description: Suggest an improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Suggestions are welcome but not promised. Please describe the problem you want to solve rather than a specific implementation.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Idea (optional)
